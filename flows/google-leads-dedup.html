<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../shared/flow.css">
</head>
<body>
<script>
window.FLOW = {
  meta:{ title:"Google Leads dedup", file:"split NEW/OLD · phone · domain · geo BAN" },
  canvas:{ w:1900, h:660 },
  legend:[
    {label:'Input',color:'var(--trig)'},
    {label:'Snowflake',color:'var(--db)'},
    {label:'Logic',color:'var(--code)'},
    {label:'BAN API',color:'var(--api)'},
    {label:'IF / branch',color:'var(--if)'},
    {label:'Output',color:'var(--out)'}
  ],
  nodes:{
    inp: {x:30, y:300,kind:'trig',ic:'▤', nm:'INPUT CSV',ttl:'Google leads (raw)',sb:'place_id · phone · domain · address'},
    sf:  {x:30, y:80, kind:'db', ic:'❄',  nm:'SNOWFLAKE',ttl:'STG_RAUL_LEADS',sb:'CRM reference set'},
    s1:  {x:280,y:200,kind:'code',ic:'≡', nm:'JOIN',ttl:'1 · Join + split',sb:'left join leads on phone / domain'},
    if1: {x:530,y:208,kind:'if', ic:'◆', ttl:'in CRM ?'},
    old: {x:730,y:50, kind:'out',ic:'⊘', nm:'OLD',ttl:'Already in CRM',sb:'flag → not for outreach'},
    new1:{x:730,y:300,kind:'code',ic:'⚏',nm:'NEW',ttl:'2 · Dedup intra-batch',sb:'phone normalized + root domain'},
    s3:  {x:980,y:300,kind:'code',ic:'🌍',nm:'GEO',ttl:'3 · Geo FR (2 stages)',sb:'address → BAN result_id → coords'},
    if2: {x:1230,y:308,kind:'if',ic:'◆', ttl:'cache hit ?'},
    cache:{x:1180,y:130,kind:'code',ic:'💾',nm:'LOCAL CACHE',ttl:'Cache result_id → coords',sb:'JSON local · skip BAN call'},
    ban: {x:1430,y:300,kind:'api',ic:'🇫🇷',nm:'BAN api.gouv',ttl:'4 · Geocode via BAN',sb:'api-adresse.data.gouv.fr'},
    s4:  {x:1680,y:300,kind:'code',ic:'⊕',nm:'MERGE',ttl:'5 · Attach coords',sb:'+ lat/lon · + result_id'},
    out: {x:1680,y:520,kind:'out',ic:'▦',nm:'OUTPUT',ttl:'leads_NEW.csv',sb:'deduped + geocoded · ready for outreach'},
    out2:{x:1680,y:50, kind:'out',ic:'▦',nm:'OUTPUT',ttl:'leads_OLD.csv',sb:'CRM matches (traceability)'}
  },
  edges:[
    ['inp','r','s1','l','',''],
    ['sf','r','s1','l','',''],
    ['s1','r','if1','l','',''],
    ['if1','t','old','b','match','f'],
    ['if1','b','new1','t','no match','t'],
    ['new1','r','s3','l','',''],
    ['s3','r','if2','l','',''],
    ['if2','t','cache','b','hit','t'],
    ['cache','r','s4','l','',''],
    ['if2','r','ban','l','miss','f'],
    ['ban','r','s4','l','',''],
    ['s4','b','out','t','',''],
    ['old','r','out2','l','',''],
  ],
  walk:['inp','s1','if1','new1','s3','if2','ban','s4','out'],
  details:{
    inp:{h:'Input',t:'Google leads (raw)',d:'CSV brut sortant du scraping Google (place_id, phone, domain, address). Plusieurs runs sont concaténés.',io:[['in','google_leads_raw.csv']]},
    sf:{h:'Snowflake reference',t:'STG_RAUL_LEADS',d:'Table de référence Snowflake contenant tous les leads déjà dans le CRM (split par pays).',io:[['out','crm_leads[]']],code:`SELECT phone_e164, root_domain, country
FROM STG.RAUL_LEADS
WHERE country = :country`,ct:'SQL'},
    s1:{h:'Logic · join',t:'1 · Join + split NEW vs OLD',d:'Left join input × Snowflake sur phone normalisé + root domain. Tag chaque lead match/no-match.',io:[['in','input + crm_leads'],['out','tagged[]']]},
    if1:{h:'Branch',t:'lead in CRM ?',d:'Si match (phone OU domaine) → OLD (déjà en CRM, on n\'outreach pas). Sinon → NEW.',io:[['match','→ OLD bucket'],['no match','→ NEW bucket']]},
    old:{h:'Bucket OLD',t:'Already in CRM',d:'Leads déjà en CRM : on les garde séparés pour traçabilité (savoir d\'où ils viennent), mais pas d\'outreach.',io:[['out','OLD csv']]},
    new1:{h:'Dedup intra-batch',t:'2 · Dedup within NEW',d:'Avant géo, on dédup le batch NEW lui-même : même phone normalisé (E.164) ou même root domain = 1 seul lead retenu.',io:[['in','new[]'],['out','new_unique[]']],code:`# phone normalize
norm = e164(phone, default_region=country)
# domain
root = tldextract(domain).registered_domain`,ct:'normalization'},
    s3:{h:'Geo · 2 étages',t:'3 · French geocoding (2 stages)',d:'FR uniquement : stage 1 lookup cache local (result_id BAN → coords), stage 2 si miss → appel BAN. Le result_id est la clé stable de la BAN, on l\'utilise pour le cache.',io:[['in','address'],['out','{lat, lon, result_id}']]},
    if2:{h:'Branch',t:'cache hit ?',d:'Si on a déjà géocodé cette adresse (result_id en cache) → skip BAN. Sinon → BAN call.',io:[['hit','→ cache lookup'],['miss','→ BAN api.gouv']]},
    cache:{h:'Cache local',t:'BAN result_id cache',d:'JSON local (~/.cache/ban-geo.json). Évite les appels BAN redondants entre runs (rate limit + rapidité).',io:[['out','coords from cache']]},
    ban:{h:'BAN · api.gouv',t:'4 · Geocode via api-adresse',d:'BAN (Base Adresse Nationale) — api.gouv officielle, free. Retourne result_id stable + lat/lon + score.',io:[['in','address string'],['out','{lat, lon, result_id, score}']],code:`GET https://api-adresse.data.gouv.fr/search/?q={address}&limit=1`,ct:'BAN call'},
    s4:{h:'Merge',t:'5 · Attach coords',d:'Attache lat/lon/result_id au lead. Update le cache local avec les nouveaux result_id.',io:[['in','lead + coords'],['out','lead enriched']]},
    out:{h:'Output NEW',t:'leads_NEW.csv',d:'Leads NEW dédupliqués + géocodés, prêts pour outreach.'},
    out2:{h:'Output OLD',t:'leads_OLD.csv',d:'Match CRM, gardés pour audit / attribution.'}
  }
};
</script>
<script src="../shared/flow.js"></script>
</body>
</html>
