<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../shared/flow.css">
</head>
<body>
<script>
window.FLOW = {
  meta:{ title:"Modjo automation", file:"modjo-bot · Railway" },
  canvas:{ w:1850, h:520 },
  legend:[
    {label:'Trigger',color:'var(--trig)'},
    {label:'Snowflake',color:'var(--db)'},
    {label:'Supabase',color:'var(--api)'},
    {label:'LLM',color:'var(--gem)'},
    {label:'N8N proxy',color:'var(--exa)'},
    {label:'Output',color:'var(--out)'}
  ],
  nodes:{
    trig:{x:30, y:220,kind:'trig',ic:'⏱',nm:'CRON · Railway',ttl:'Trigger',sb:'Railway service scheduled job'},
    s1:  {x:262,y:220,kind:'db', ic:'❄', nm:'SNOWFLAKE',ttl:'1 · Read RAUL',sb:'pull new Modjo calls to score'},
    s2:  {x:494,y:220,kind:'gem',ic:'✦', nm:'LLM',ttl:'2 · Qualify / score',sb:'extract qualif fields per call'},
    s3:  {x:726,y:220,kind:'api',ic:'⊡', nm:'SUPABASE',ttl:'3 · Write enriched',sb:'project egodphryqjdmsriqmoqy'},
    if1: {x:990,y:228,kind:'if', ic:'◆',ttl:'push to SF ?'},
    s4:  {x:1180,y:80, kind:'exa',ic:'⇄', nm:'N8N · webhook',ttl:'4 · Proxy → Salesforce',sb:'N8N receives payload, writes SF'},
    log: {x:1180,y:360,kind:'code',ic:'▣', nm:'_log_batch_outcome',ttl:'Batch log',sb:'aggregate ok/total + sample errors'},
    out: {x:1430,y:220,kind:'out',ic:'▦', nm:'OUTPUT',ttl:'SF updated · logs',sb:'Salesforce fields + Supabase run log'}
  },
  edges:[
    ['trig','r','s1','l','',''],
    ['s1','r','s2','l','',''],
    ['s2','r','s3','l','',''],
    ['s3','r','if1','l','',''],
    ['if1','t','s4','b','match found','t'],
    ['if1','b','log','t','skip / errors','f'],
    ['s4','r','out','l','',''],
    ['log','r','out','l','',''],
  ],
  walk:['trig','s1','s2','s3','if1','s4','out'],
  details:{
    trig:{h:'Railway cron',t:'Trigger — Railway service',d:'Service Railway dans le workspace Skello Marketing. Cron horaire qui pull les nouveaux appels Modjo à scorer.',io:[['in','schedule cron'],['out','run start']]},
    s1:{h:'Snowflake · read',t:'1 · Read RAUL table',d:'Pull les nouveaux appels Modjo non encore enrichis depuis Snowflake (DB RAUL). Filter sur created_at + flag scored=false.',io:[['out','calls_to_process[]']],code:`SELECT id, call_id, transcript, account_id, ...
FROM RAUL.MODJO.CALLS
WHERE scored = FALSE
  AND created_at > :since
LIMIT :batch_size`,ct:'SQL'},
    s2:{h:'LLM · qualify',t:'2 · Qualify / score each call',d:'Pour chaque appel : extraction des champs métier (qualif, scoring, intent, concurrents mentionnés…). Sortie JSON structurée.',io:[['in','transcript'],['out','qualif fields (JSON)']],code:`{
  "qualif_status": "...",
  "intent_score": 0.0-1.0,
  "skello_competitors": [...],
  "next_steps": "..."
}`,ct:'LLM output'},
    s3:{h:'Supabase · write',t:'3 · Write enriched rows',d:'Insert / upsert dans le projet Supabase dédié egodphryqjdmsriqmoqy. Stockage tampon avant push SF.',io:[['in','qualif rows[]'],['out','supabase row IDs']],code:`POST /rest/v1/modjo_qualif?on_conflict=call_id
Prefer: resolution=merge-duplicates`,ct:'Supabase REST'},
    if1:{h:'Branch',t:'push back to Salesforce ?',d:'Si match avec un objet SF (account / opportunity) → push via N8N. Sinon on log juste l\'outcome batch et on stoppe.',io:[['true','→ N8N webhook'],['false','→ batch log']]},
    s4:{h:'N8N · webhook proxy',t:'4 · Push to Salesforce (via N8N)',d:'On ne push pas SF directement : un workflow N8N reçoit le payload, gère l\'auth SF et fait l\'update. Permet de centraliser la logique d\'écriture SF.',io:[['in','{sf_object_id, fields}'],['out','SF write ack']],code:`POST https://n8n.../webhook/modjo-to-sf
{ "object": "Account", "id": "001...", "fields": {...} }`,ct:'N8N proxy call'},
    log:{h:'Batch logging',t:'_log_batch_outcome — règle 80%',d:'Jamais un log par item raté. Toujours agréger en summary ok/total (rate) + sample d\'erreurs si <80% succès. Écrit dans Supabase run_logs.',io:[['in','batch results[]'],['out','run_log row']],code:`_log_batch_outcome(
  ok=ok, total=total,
  sample_errors=errors[:5],
)  # n'écrit le détail que si rate < 0.8`,ct:'logging convention'},
    out:{h:'Output',t:'SF updated + Supabase run log',d:'Salesforce contient les champs Modjo enrichis. Supabase garde une trace du run pour observabilité.',io:[['out','SF fields + run_logs']]}
  }
};
</script>
<script src="../shared/flow.js"></script>
